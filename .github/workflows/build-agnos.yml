name: Build AGNOS system and kernel (arm64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build AGNOS system and kernel on ARM64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static curl xz-utils bsdutils kmod e2fsprogs dosfstools mtools simg2img android-sdk-libsparse-utils build-essential ca-certificates git pkg-config wget openssl

      - name: Download Ubuntu base tarball if missing
        run: |
          if [ ! -f ubuntu-base-24.04.3-base-arm64.tar.gz ]; then
            curl -O https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.3-base-arm64.tar.gz
          fi

      - name: Make build scripts executable
        run: chmod +x build_system.sh build_kernel.sh userspace/*.sh

      - name: Build AGNOS system image
        run: sudo ./build_system.sh

      - name: Build AGNOS kernel image
        run: sudo ./build_kernel.sh

      - name: Upload system.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: agnos-system-img
          path: output/system.img

      - name: Upload boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: agnos-boot-img
          path: output/boot.img
